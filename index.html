<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STARFALL // シューティング</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✦</span><div><p class="eyebrow">DEEP SPACE ARCADE</p><h1>STARFALL <span>//</span> 紅蓮の航路</h1></div></div>
      <div class="status"><span class="status-dot"></span> SYSTEM ONLINE</div>
    </header>
    <section class="stage-wrap">
      <canvas id="game" width="960" height="640" aria-label="STARFALL シューティングゲーム"></canvas>
      <div class="hud hud-left"><span class="label">SCORE</span><strong id="score">0000000</strong><span class="label">HI-SCORE</span><strong id="highScore">0000000</strong><span class="label">POWER</span><strong id="power">LV.0　00/30</strong></div>
      <div class="hud hud-right"><span class="label">STAGE</span><strong id="stage">01</strong><span class="label">BOMB</span><strong id="bombs">×3</strong><span class="label">SHIELD</span><div id="shield" class="shield"><i></i><i></i><i></i></div></div>
      <div id="bossHud" class="boss-hud hidden"><div id="bossName" class="boss-name">BOSS // NIGHTFALL CORE <span id="bossPhase">PHASE 1</span></div><div class="boss-track"><div id="bossHealth" class="boss-health"></div></div><div class="boss-count" id="bossCount">5 GAUGES REMAIN</div></div>
      <div id="bossAlert" class="boss-alert"></div>
      <div id="overlay" class="overlay"></div>
    </section>
    <footer class="controls"><span><b>Mouse</b> 移動</span><span><b>← ↑ ↓ →</b> 移動</span><span><b>Shift</b> 低速移動</span><span><b>Z / Space / Click</b> ショット</span><span><b>X / Right Click</b> ボム</span><span><b>ESC</b> 一時停止</span><span><b>R</b> ホーム</span></footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
